<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#222222">
<title>Paper送信</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Paper送信</h1>
  <span id="ver"></span>
</header>

<main>
  <div id="stage">
    <canvas id="preview" width="540" height="960"></canvas>
    <p id="empty">画像を選ぶか、スクショの「共有」からこのアプリを選んでください</p>
  </div>

  <div class="row">
    <label class="btn" for="file">画像を選ぶ</label>
    <input id="file" type="file" accept="image/*" hidden>
    <button id="rot" class="btn" disabled>回転</button>
    <button id="fitCover" class="btn" disabled>画面いっぱい</button>
    <button id="fitContain" class="btn" disabled>全体</button>
  </div>
  <div class="row">
    <label class="seg"><input type="radio" name="tone" value="gray" checked> グレー（写真向け）</label>
    <label class="seg"><input type="radio" name="tone" value="bw"> 白黒くっきり（QR向け）</label>
  </div>

  <button id="send" class="btn primary" disabled>M5Paper に送る</button>
  <progress id="prog" max="1" value="0" hidden></progress>
  <p id="status">M5PaperS3 の電源ボタンを押してから1分以内に送ってください。指でずらす・2本指で拡大できます。</p>
</main>

<script src="app.js"></script>
</body>
</html>
